name: PR Comment - CI Info

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🚀 CI Optimization Active

            **Quick Feedback Mode:** This PR runs only fast checks (~2-3 min):
            - ✅ Lint & format validation
            - ✅ Unit tests (no external dependencies)

            **Integration tests skipped** to speed up your feedback loop.

            ### Full test suite will run when:
            - ✅ Merged to \`main\` branch
            - ✅ Manual trigger via [Actions tab](${context.payload.repository.html_url}/actions/workflows/ci.yml)

            ### To run full tests manually:
            1. Go to [CI Workflow](${context.payload.repository.html_url}/actions/workflows/ci.yml)
            2. Click "Run workflow"
            3. Select your PR branch

            ---
            💡 **Tip:** Before requesting review, verify integration tests pass on your local machine:
            \`\`\`bash
            supabase start
            deno test -A
            \`\`\`
            `;

            // Check if comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('CI Optimization Active')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
