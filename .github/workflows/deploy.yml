name: Deploy to Supabase

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ]; then
            echo "Error: SUPABASE_PROJECT_ID secret is not set"
            echo "Please add SUPABASE_PROJECT_ID to GitHub repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "Error: SUPABASE_ACCESS_TOKEN secret is not set"
            echo "Please add SUPABASE_ACCESS_TOKEN to GitHub repository secrets"
            exit 1
          fi

      - name: Deploy telegram-webhook (no JWT verification)
        run: supabase functions deploy telegram-webhook --no-verify-jwt --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy other edge functions
        run: |
          # Deploy all other functions individually with default JWT verification
          for func in supabase/functions/*/; do
            func_name=$(basename "$func")
            if [ "$func_name" != "telegram-webhook" ] && [ "$func_name" != "_shared" ]; then
              echo "Deploying $func_name..."
              supabase functions deploy "$func_name" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
