name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno lint
        run: deno lint

      - name: Run Deno format check
        run: deno fmt --check --ignore=docs/,README.md

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create Edge Functions environment file
        run: |
          cat > supabase/.env.local << EOF
          SUPABASE_URL=http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          TELEGRAM_BOT_TOKEN=test-bot-token-for-ci
          TELEGRAM_WEBHOOK_SECRET=test-webhook-secret-for-ci
          GOOGLE_GEMINI_API_KEY=test-gemini-key-for-ci
          EOF

      - name: Start Supabase local instance
        run: supabase start

      - name: Run tests
        run: deno test -A
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          TELEGRAM_BOT_TOKEN: test-bot-token-for-ci
          TELEGRAM_WEBHOOK_SECRET: test-webhook-secret-for-ci
          GOOGLE_GEMINI_API_KEY: test-gemini-key-for-ci
