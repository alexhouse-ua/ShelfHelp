name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno lint
        run: deno lint

      - name: Run Deno format check
        run: deno fmt --check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start &

      - name: Wait for Supabase to be ready
        run: |
          echo "Waiting for Supabase to be ready..."
          timeout 120 bash -c 'until curl -f http://127.0.0.1:54321/rest/v1/ 2>/dev/null; do
            echo "Waiting for Supabase...";
            sleep 3;
          done'
          echo "Supabase is ready!"

      - name: Run tests
        run: deno test -A
