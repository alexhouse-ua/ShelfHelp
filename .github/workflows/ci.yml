name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno lint
        run: deno lint

      - name: Run Deno format check
        run: deno fmt --check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Serve Edge Functions
        run: supabase functions serve &
        env:
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_WEBHOOK_SECRET: test_secret
          GOOGLE_GEMINI_API_KEY: test_key

      - name: Wait for Edge Functions to be ready
        run: sleep 5

      - name: Run tests
        run: deno test -A
