updated: "2025-10-13T22:40:00Z"

waiver: { active: false }

bugs_fixed_during_testing:
  - id: "BUG-001"
    severity: critical
    finding: "LangGraph node naming conflict - 'error' node name collided with state.error field"
    fix: "Renamed node from 'error' to 'handle_error' (reflection-workflow.ts:364, 400)"
    commit: "b06a420"
    status: "RESOLVED"

  - id: "BUG-002"
    severity: critical
    finding: "Infinite recursion loop - workflow sent Question 1 100+ times until GraphRecursionError"
    fix: "Restructured graph edges to reach END after each question. Added routeStart() conditional edge."
    commit: "b06a420"
    status: "RESOLVED"

  - id: "BUG-003"
    severity: high
    finding: "Stale current_question source - handler read from conversational_state instead of checkpoint"
    fix: "Read current_question from currentState.values (LangGraph checkpoint) not conversational_state"
    commit: "51dd209"
    status: "RESOLVED"

  - id: "BUG-004"
    severity: high
    finding: "Schema mismatch - code tried to INSERT user_reflection but table only has content column"
    fix: "Changed INSERT to use content column with reflection_type='analysis'"
    commit: "ff4f1f5"
    status: "RESOLVED"

  - id: "BUG-005"
    severity: critical
    finding: "Checkpoint collision - all books used same thread_id, caused wrong book_id in finalization"
    fix: "Use unique thread_id per book: ${chatId}-${bookId}"
    commit: "d3ab5c6"
    status: "RESOLVED"

remaining_technical_debt:
  - id: "TEST-001"
    severity: low
    finding: "Integration tests remain disabled (ignore:true) - manual E2E testing validates functionality"
    suggested_action: "Enable at least 1 integration test for regression coverage (optional)"
    suggested_owner: dev

  - id: "TYPE-001"
    severity: low
    finding: "TypeScript compilation requires --no-check flag due to checkpoint package version mismatch"
    suggested_action: "Pin checkpoint package version in imports or update deno.lock"
    suggested_owner: dev

  - id: "PERF-001"
    severity: low
    finding: "Checkpointer recreated per invocation - potential connection pool exhaustion under load"
    suggested_action: "Implement checkpointer singleton pattern or module-level caching"
    suggested_owner: dev

  - id: "SEC-001"
    severity: low
    finding: "Webhook secret validation disabled (TODO comment at telegram-webhook/index.ts:1321)"
    suggested_action: "Re-enable webhook secret validation before multi-user production"
    suggested_owner: dev

